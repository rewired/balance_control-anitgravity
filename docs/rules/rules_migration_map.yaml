# Recommended code-side checks to make the migration safe and measurable.
# (Implement as CI tests or as a one-shot migration script.)
verification:
  required_checks:
    - name: "all_referenced_ids_exist_in_target"
      description: "Parse source code for CORE-01/VAR/ADD56 IDs; assert each exists in the target rule text."
      severity: "error"
    - name: "no_duplicate_ids_in_target"
      description: "Scan target rules for duplicate ID tokens; duplicates break anchoring."
      severity: "error"
    - name: "dom_for_inf_glossary_present"
      description: "Assert CORE-01-02-04B/04C/04D exist (human/UX glossary invariants)."
      severity: "warn"
    - name: "rng_and_shuffle_contract_present"
      description: "Assert CORE-01-03-02A.*, CORE-01-03-02B exist (determinism invariants)."
      severity: "error"
    - name: "topology_contract_present"
      description: "Assert CORE-01-00-T01..T09 exist (engine boundary contract)."
      severity: "error"

code_migration_guidance:
  do:
    - "Keep rule references by ID; treat IDs as stable API."
    - "If you display human-readable headings, derive them dynamically; do not hardcode heading paths."
    - "Update the ruleset version string in code/config to v1.1.0 (if you enforce it)."
  dont:
    - "Do not replace ID anchors with heading-based anchors."
    - "Do not renumber or reformat IDs (even if you reflow text)."
