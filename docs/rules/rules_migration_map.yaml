# rules_migration_map.yaml
# BALANCE // CONTROL — CORE-01 rules migration map
# Purpose: machine-readable mapping to help update/verify source-code anchors and rule references.
# Assumption (based on the provided 1.0.26 + 1.1.0 texts): IDs are stable; changes are editorial only.

schema_version: 1
project: "BALANCE // CONTROL"
ruleset:
  from:
    name: "CORE-01"
    version: "v1.0.26"
    scope: "core + variants (no expansions)"
  to:
    name: "CORE-01"
    version: "v1.1.0"
    scope: "core + variants (no expansions)"

id_contract:
  id_style: "CORE-01-XX-YY-ZZ (and sub-IDs like -A, .1, -T01, etc.)"
  id_stability: true
  default_mapping: "same_id"  # if not explicitly listed, treat as same ID in target

migration_summary:
  semantic_change: false
  change_type: "editorial_reflow_and_grouping_only"
  breaking_change_risk: "low"
  notes:
    - "IDs remain canonical anchors; do not renumber."
    - "Headings/section formatting changed; code should not rely on headings for anchoring."
    - "DOM/FOR/INF meaning remains defined via CORE-01-02-04B/04C/04D."

# Optional: section/title mapping (useful if your tooling references headings).
# IMPORTANT: do NOT use titles as primary anchors; IDs are the API.
