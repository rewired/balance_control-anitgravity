name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack + activate pnpm 9
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -w build

      - name: Run spec audit
        run: pnpm run audit:spec

      - name: Run documentation verification
        run: pnpm run verify:docs

      - name: Check spec-anchor compliance
        run: pnpm run check:spec-anchors

      - name: Run test suite (workspace, non-E2E)
        run: pnpm -w test

  ui_unit:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack + activate pnpm 9
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend gate — UI Unit (Vitest)
        run: pnpm run test:ui:unit

  ui_e2e:
    runs-on: ubuntu-latest
    needs: ui_unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack + activate pnpm 9
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -w build

      - name: Install Playwright Linux dependencies + Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: ARCH-06 contract e2e
        run: pnpm run test:ui:e2e:arch06

      - name: Frontend gate — UI E2E (Playwright)
        run: pnpm run test:ui:e2e
